<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastest 5 Cars</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
  </head>
  <body>
    <main class="page">
      <div class="slider-shell">
        <h1>Fastest 5 Cars</h1>
        <p class="subtitle">The compilation of fastest production cars.</p>

        <section class="slider" aria-label="Fastest cars slider">
          <div class="slider-viewport">
            <div class="slider-track">
              <article class="slide">
                <img src="assets/bugatti.jpg" alt="Bugatti Chiron">
                <div class="slide-overlay"></div>
                <div class="slide-content">
                  <div class="slide-brand">01 / BUGATTI</div>
                  <h2>CHIRON <span>SUPER SPORT</span></h2>
                </div>
                <div class="slide-side-counter">
                  <span>02</span>
                  <i></i>
                </div>
              </article>

              <article class="slide">
                <img src="assets/ssc.jpg" alt="SSC Tuatara" loading="lazy">
                <div class="slide-overlay"></div>
                <div class="slide-content">
                  <div class="slide-brand">02 / SSC</div>
                  <h2>TUATARA <span>TOP SPEED</span></h2>
                </div>
                <div class="slide-side-counter">
                  <span>03</span>
                  <i></i>
                </div>
              </article>

              <article class="slide">
                <img src="assets/jesko.jpg" alt="Koenigsegg Jesko" loading="lazy">
                <div class="slide-overlay"></div>
                <div class="slide-content">
                  <div class="slide-brand">03 / KOENIGSEGG</div>
                  <h2>JESKO <span>ABSOLUT</span></h2>
                </div>
                <div class="slide-side-counter">
                  <span>04</span>
                  <i></i>
                </div>
              </article>

              <article class="slide">
                <img src="assets/venom.jpg" alt="Hennessey Venom F5" loading="lazy">
                <div class="slide-overlay"></div>
                <div class="slide-content">
                  <div class="slide-brand">04 / HENNESSEY</div>
                  <h2>VENOM <span>F5</span></h2>
                </div>
                <div class="slide-side-counter">
                  <span>05</span>
                  <i></i>
                </div>
              </article>

              <article class="slide">
                <img src="assets/rimac.jpg" alt="Rimac Nevera" loading="lazy">
                <div class="slide-overlay"></div>
                <div class="slide-content">
                  <div class="slide-brand">05 / RIMAC</div>
                  <h2>NEVERA <span>EV</span></h2>
                </div>
                <div class="slide-side-counter">
                  <span>01</span>
                  <i></i>
                </div>
              </article>
            </div>
          </div>

          <div class="slider-controls">
            <div class="slider-arrows">
              <button class="slider-arrow slider-arrow--prev" type="button" aria-label="Previous slide">&#8592;</button>
              <button class="slider-arrow slider-arrow--next" type="button" aria-label="Next slide">&#8594;</button>
            </div>
          </div>

          <div class="slider-dots" role="group" aria-label="Choose a slide"></div>
        </section>
      </div>
    </main>
  </body>
</html>
